x-airflow-common: &airflow-common
    build:
        context: .
        dockerfile: Dockerfile.airflow
    image: datamining-airflow:2.10.0
    environment: &airflow-environment
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
        AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
        AIRFLOW__WEBSERVER__SECRET_KEY: local-development-airflow-secret
        CRAWL_MAX_RESULTS_PER_QUERY: ${CRAWL_MAX_RESULTS_PER_QUERY:-10}
        SIMULATION_NUM_USERS: ${SIMULATION_NUM_USERS:-1000}
    volumes:
        - ./dags:/opt/airflow/dags:ro
        - ./raw:/opt/airflow/raw:ro
        - ./data_lake:/opt/airflow/data_lake
        - airflow_logs:/opt/airflow/logs

services:
    airflow-postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: airflow
            POSTGRES_PASSWORD: airflow
            POSTGRES_DB: airflow
        volumes:
            - airflow_postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
            interval: 5s
            timeout: 5s
            retries: 20
    postgres:
        image: postgres:18-alpine
        container_name: postgres_dwh
        environment:
            POSTGRES_USER: dataeng
            POSTGRES_PASSWORD: dataeng123
            POSTGRES_DB: dwh
        command: ["postgres", "-c", "wal_level=logical"]
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql

    minio:
        image: cgr.dev/chainguard/minio:latest
        container_name: minio_lake
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin123
        command: server /data --console-address ":9001"
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio_data:/data

    zookeeper:
        image: quay.io/debezium/zookeeper:2.7
        container_name: zookeeper
        ports:
            - "2181:2181"
            - "2888:2888"
            - "3888:3888"
        volumes:
            - zookeeper_data:/zookeeper/data
            - zookeeper_txns:/zookeeper/txns
    kafka:
        image: quay.io/debezium/kafka:2.7
        container_name: kafka
        ports:
            - "9092:9092"
        environment:
            ZOOKEEPER_CONNECT: zookeeper:2181
        depends_on:
            - zookeeper
        volumes:
            - kafka_data:/kafka/data

    debezium:
        image: quay.io/debezium/connect:2.7
        container_name: debezium_connect
        ports:
            - "8083:8083"
        environment:
            BOOTSTRAP_SERVERS: kafka:9092
            GROUP_ID: 1
            CONFIG_STORAGE_TOPIC: my_connect_configs
            OFFSET_STORAGE_TOPIC: my_connect_offsets
            STATUS_STORAGE_TOPIC: my_connect_statuses
        depends_on:
            - kafka
            - postgres

    airflow-init:
        <<: *airflow-common
        container_name: airflow_init
        environment:
            <<: *airflow-environment
            _AIRFLOW_DB_MIGRATE: "true"
            _AIRFLOW_WWW_USER_CREATE: "true"
            _AIRFLOW_WWW_USER_USERNAME: admin
            _AIRFLOW_WWW_USER_PASSWORD: admin
        command: ["version"]
        depends_on:
            airflow-postgres:
                condition: service_healthy

    airflow-webserver:
        <<: *airflow-common
        container_name: airflow_webserver
        command: ["webserver"]
        ports:
            - "8080:8080"
        depends_on:
            airflow-init:
                condition: service_completed_successfully

    airflow-scheduler:
        <<: *airflow-common
        container_name: airflow_scheduler
        command: ["scheduler"]
        depends_on:
            airflow-init:
                condition: service_completed_successfully

    superset:
        image: apache/superset:master
        container_name: superset_bi
        ports:
            - "8088:8088"
        environment:
            SUPERSET_SECRET_KEY: my_super_secret_key_12345
            SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://dataeng:dataeng123@postgres_dwh:5432/superset
        depends_on:
            - postgres

volumes:
    airflow_postgres_data:
    airflow_logs:
    postgres_data:
        name: dwh_postgres_data
    minio_data:
        name: dwh_minio_data
    zookeeper_data:
        name: dwh_zookeeper_data
    zookeeper_txns:
        name: dwh_zookeeper_txns
    kafka_data:
        name: dwh_kafka_data
